<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM 2</title>
  </head>
  <body>
    First No. <input type="text" id="txt1" />
    <br />
    Second No. <input type="text" id="txt2" />
    <button onclick="add()">Add</button>
    <h2 id="result"></h2>
    <div id="sum"></div>
  </body>
  <script>
    function add() {
      const num1 = document.getElementById("txt1").value;
      const num2 = document.getElementById("txt2").value;

      const result = parseInt(num1) + parseInt(num2);
      console.log(result);

      document.getElementById("result").
        innerHTML = "Addition of Numbers is " + result;

        document.getElementById("sum").innerHTML = "Addition is "+result; 
    }
  </script>
</html>
