<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" id="txt1" class="num" />
    <input type="text" id="txt2" class="num" />
    <button onclick="add()">Add</button>
    <h2 class="add"></h2>
  </body>
  <script>
    function add() {
      const inputs = document.querySelectorAll("input");
      //const txt1 = parseInt(inputs[0].value);
      //const txt2 = parseInt(inputs[1].value);
      //const add = txt1 + txt2;
      //console.log(add);
      let sum = 0;
      for (i = 0; i < inputs.length; i++) {
        sum = sum + parseInt(inputs[i].value);
      }

      document.getElementsByClassName("add")[0].innerHTML =
        "Addition of 2 numbers is " + sum;
    }
  </script>
</html>
