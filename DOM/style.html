<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 onclick="change()">This is a Header</h2>
    <h3>Header 3 here</h3>
</body>
<script>
    function change(){
    const head = document.getElementsByTagName("h2");
    head[0].style.color = "blue"
    head[0].style.backgroundColor = "Yellow"
    head[0].style.textAlign = "center"
    //Use Camel Case while applying the property
    }
</script>
</html>
